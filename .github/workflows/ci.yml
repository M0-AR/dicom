name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Generate and inspect a study
        run: |
          python generate_dicom.py
          python - <<'PY'
          from pydicom import dcmread

          ds = dcmread("test.dcm")
          assert ds.Modality == "MR"
          assert ds.Rows == 256 and ds.Columns == 256
          assert ds.BitsAllocated == 16
          assert ds.file_meta.TransferSyntaxUID == "1.2.840.10008.1.2.1"
          assert ds.PatientName == "SYNTHETIC^PATIENT"
          assert ds.pixel_array.size == 256 * 256
          print("Generated DICOM study is valid.")
          PY
