services:
  orthanc:
    image: jodogne/orthanc:1.13.0
    container_name: dicom-forge-orthanc
    command: ["/etc/orthanc/dicom-forge.json"]
    ports:
      - "4242:4242"
      - "8042:8042"
    volumes:
      - ./docker/orthanc.json:/etc/orthanc/dicom-forge.json:ro
      - orthanc-data:/var/lib/orthanc/db

volumes:
  orthanc-data:
